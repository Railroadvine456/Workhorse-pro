<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workhorse Pro | Construction Command Center</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f5;background:#0b1016}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}header{height:72px;display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid #28313d;background:#0d131a;position:sticky;top:0;z-index:5}.logo{font-size:27px;font-weight:850;white-space:nowrap}.logo span,.accent{color:#ff8126}.subtitle{font-size:10px;letter-spacing:1.1px;color:#9faab8}.search{flex:1;max-width:550px}.search input{width:100%}.pill{border:1px solid #2e3b48;padding:8px 12px;border-radius:20px;color:#94e7b5;font-size:12px}.layout{display:flex;min-height:calc(100vh - 72px)}aside{width:225px;flex-shrink:0;border-right:1px solid #28313d;padding:20px 10px;background:#0d131a}nav button{width:100%;display:block;text-align:left;background:none;color:#cbd5e1;border:0;padding:12px 14px;border-radius:7px;margin-bottom:3px}nav button.active,nav button:hover{background:#ed741a;color:white}main{padding:25px;flex:1;min-width:0;max-width:1700px}h1{font-size:27px;margin:0 0 5px}h2{font-size:18px;margin:0 0 15px}p{color:#9ba8b7}small{color:#99a9b9}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.panel,.stat{border:1px solid #303b49;background:linear-gradient(135deg,#19222c,#10171f);border-radius:10px;padding:18px;min-width:0}.stat strong{font-size:28px;display:block;margin:10px 0 3px}.stat span{font-size:12px;color:#b1bfce}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:17px}.btn{border:0;background:#f47a20;color:white;border-radius:7px;padding:10px 14px;font-weight:650}.btn.secondary{background:#283442}.btn.danger{background:#8b3131}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:15px 0}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-size:12px;color:#a7b6c7}input,select,textarea{background:#111922;border:1px solid #344454;border-radius:6px;padding:10px;color:#f3f7fa;min-width:0}input[type=number]{width:130px}textarea{width:100%;min-height:85px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #2b3643;padding:10px 8px}th{color:#aab7c6;background:#202b36}td input{width:100%;min-width:65px;padding:7px}.right{text-align:right}.total{font-size:23px;color:#ff8a2e;font-weight:800;text-align:right;padding:15px}.tag{background:#194b36;color:#85e8aa;padding:4px 9px;border-radius:6px;font-size:12px}.muted{color:#a7b4c2}.hide{display:none!important}.drawing{position:relative;background:#fff;border-radius:8px;overflow:hidden;min-height:300px;touch-action:none}.drawing img{display:block;width:100%;height:auto;pointer-events:none}.drawing canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.placeholder{padding:90px 15px;color:#637181;text-align:center}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.summary{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #2b3744}.earth{background:radial-gradient(ellipse at 40% 40%,#134f55,#17382e 36%,#785d2e 65%,#1a2630 85%);height:230px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#dbe9ef;font-weight:700;letter-spacing:2px}.scroll{overflow:auto}.note{border-left:3px solid #f47a20;padding:12px;background:#22252a;color:#d6dee6;margin:12px 0;font-size:13px}.project{cursor:pointer}.project:hover{background:#253340}.mobilemenu{display:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}aside{width:175px}main{padding:16px}}@media(max-width:650px){header{height:auto;padding:10px;flex-wrap:wrap}.logo{font-size:22px}.search{order:3;max-width:none;flex-basis:100%}.pill{margin-left:auto}aside{width:100%;padding:5px;overflow-x:auto;border-right:0;border-bottom:1px solid #273440}nav{display:flex;gap:4px}nav button{white-space:nowrap;width:auto;padding:10px}.layout{display:block}main{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.stat strong{font-size:22px}table{min-width:600px}.panel{padding:12px}}

.dash-title{display:flex;align-items:center;justify-content:space-between;gap:15px}.dashboard-stats{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:18px}.dashboard-stats .stat{padding:15px 12px;min-height:118px}.dashboard-stats .stat strong{font-size:25px;color:#f8fbff}.dashboard-stats .stat .small-stat{font-size:16px;color:#ff852c}.dashboard-panels{grid-template-columns:1fr 1fr}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.panel-head h2{margin:0}.mini-action{background:#283442;border:1px solid #3b4652;color:#e5edf5;border-radius:5px;padding:7px 10px}.preview{height:265px;border-radius:7px;background-size:cover;background-position:center;position:relative;overflow:hidden}.earth-preview{background-image:url('earth_preview.jpg')}.plan-preview{background-image:url('plan_preview.jpg')}.preview-caption{position:absolute;bottom:10px;left:10px;padding:7px 10px;border-radius:5px;background:#101820e8;font-size:11px;letter-spacing:1px;color:#ff8a31}.panel-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:13px;font-size:12px;color:#aab9c7}.dashboard-panels .panel{min-height:280px}.dashboard-panels td{padding:12px 7px}.dashboard-panels th{padding:10px 7px}@media(max-width:1200px){.dashboard-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:750px){.dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-panels{grid-template-columns:1fr}.preview{height:215px}.dash-title{align-items:flex-start}.dash-title .btn{font-size:12px}}
@media(max-width:800px){header{padding:10px;height:auto;flex-wrap:wrap}.search{order:3;max-width:none;width:100%}.layout{display:block}aside{width:100%;overflow-x:auto;padding:8px}nav{display:flex;min-width:max-content}nav button{width:auto;white-space:nowrap;margin:0}main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.table-wrap{overflow-x:auto}table{min-width:640px}}.table-wrap{overflow-x:auto}textarea{width:100%;background:#111b25;color:#eaf0f5;border:1px solid #344454;border-radius:6px;padding:10px}a{color:#ff9c55}</style><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><header><div><div class="logo">◈ Workhorse <span>Pro</span></div><div class="subtitle">ESTIMATE · TAKEOFF · EARTHWORKS · MANAGE</div></div><div class="search"><input id="globalSearch" placeholder="Search projects and estimates..."></div><div class="pill">● Local workspace</div></header><div class="layout"><aside><nav id="nav"></nav></aside><main id="app"></main></div><script>
const KEY='workhorse_pro_v1';const defaultData={projects:[],estimates:[],takeoffs:[],earthworks:[],tasks:[],bids:[],fieldLogs:[],documents:[],costItems:[],customers:[],changeOrders:[],rfis:[],equipment:[],timecards:[],grids:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultData)}catch{db=structuredClone(defaultData)};for(const k in defaultData)db[k]??=[];let page='Dashboard',currentEstimate=null,currentTakeoff=null,currentEarth=null,drawMode='length',points=[],scale=1,drawn=[],drawingImage=null;const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage full. Export a backup and remove large attachments.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const button=(name,action,cls='')=>`<button class="btn ${cls}" onclick="${action}">${name}</button>`;const field=(label,id,value='',type='text')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`;const navs=['Dashboard','Estimating','PDF Takeoff','Earthworks','Projects','Scheduling','Bid Management','Field Logs','Documents','Cost Database','Job Costs','Invoices','Customers','Change Orders','RFIs','Equipment','Timecards','Grid Earthworks','Reports','Settings'];function go(p){page=p;render()}function render(){ $('nav').innerHTML=navs.map(n=>`<button class="${n===page?'active':''}" onclick="go('${n}')">${({'Dashboard':'▦','Estimating':'▤','PDF Takeoff':'▧','Earthworks':'◭','Projects':'▣','Scheduling':'▢','Bid Management':'◇','Field Logs':'▣','Documents':'▤','Cost Database':'＄','Job Costs':'▤','Invoices':'＄','Customers':'♙','Change Orders':'⇄','RFIs':'?','Equipment':'⚒','Timecards':'◷','Grid Earthworks':'▦','Reports':'▥','Settings':'⚙'})[n]} &nbsp; ${n}</button>`).join('');let fn=({'Dashboard':dashboard,'Estimating':estimating,'PDF Takeoff':takeoff,'Earthworks':earthworks,'Projects':projects,'Scheduling':scheduling,'Bid Management':bidsPage,'Field Logs':fieldPage,'Documents':docsPage,'Cost Database':costPage,'Job Costs':jobCostsPage,'Invoices':invoicesPage,'Customers':customersPage,'Change Orders':changeOrdersPage,'RFIs':rfisPage,'Equipment':equipmentPage,'Timecards':timecardsPage,'Grid Earthworks':gridEarthPage,'Reports':reports,'Settings':settings})[page];$('app').innerHTML=fn();if(page==='PDF Takeoff')initCanvas();}
function dashboard(){const value=db.estimates.reduce((s,e)=>s+estimateTotal(e),0),area=db.takeoffs.reduce((s,t)=>s+t.measurements.filter(m=>m.unit==='SF').reduce((a,m)=>a+m.value,0),0),active=db.projects.filter(p=>p.status==='In Progress').length;return `<div class="dash-title"><div><h1>Dashboard</h1><p>Construction command center · Live workspace</p></div>${button('+ New Project',"newProject()")}</div><div class="grid dashboard-stats"><div class="stat"><span>💲 &nbsp; Open Estimates</span><strong>${db.estimates.length}</strong><span>${money(value)} estimated</span></div><div class="stat"><span>🏗️ &nbsp; Active Projects</span><strong>${active}</strong><span>${db.projects.length} total projects</span></div><div class="stat"><span>📐 &nbsp; PDF Takeoffs</span><strong>${db.takeoffs.length}</strong><span>${area.toFixed(0)} SF measured</span></div><div class="stat"><span>🚜 &nbsp; Earthworks</span><strong>${db.earthworks.length}</strong><span>Cut / fill worksheets</span></div><div class="stat"><span>📅 &nbsp; Tasks</span><strong>${db.tasks.length}</strong><span>Scheduled work</span></div><div class="stat"><span>📊 &nbsp; Total Bid Value</span><strong class="small-stat">${money(value)}</strong><span>Current estimates</span></div></div><div class="cols dashboard-panels"><div class="panel visual-panel"><div class="panel-head"><h2>Earthworks — Site Model</h2><button class="mini-action" onclick="go('Earthworks')">Open ↗</button></div><div class="preview earth-preview"><div class="preview-caption">SITE GRADING · CUT / FILL</div></div><div class="panel-foot">Calculate excavation, fill and net volumes ${button('New Calculation',"newEarth()",'secondary')}</div></div><div class="panel visual-panel"><div class="panel-head"><h2>Takeoff — Site Plan</h2><button class="mini-action" onclick="go('PDF Takeoff')">Open ↗</button></div><div class="preview plan-preview"><div class="preview-caption">PLAN MEASUREMENT · LENGTH & AREA</div></div><div class="panel-foot">Measure uploaded drawings ${button('Start Takeoff',"newTakeoff()",'secondary')}</div></div><div class="panel"><div class="panel-head"><h2>Estimating — Bid Workspace</h2><button class="mini-action" onclick="go('Estimating')">All Estimates ↗</button></div><table><thead><tr><th>Estimate</th><th>Items</th><th style="text-align:right">Total</th></tr></thead><tbody>${db.estimates.slice(-5).reverse().map(e=>`<tr><td>${esc(e.name)}</td><td>${e.items.length}</td><td style="text-align:right">${money(estimateTotal(e))}</td></tr>`).join('')||'<tr><td colspan="3">No estimates yet. Create your first bid.</td></tr>'}</tbody></table><div class="panel-foot">${button('+ New Estimate',"newEstimate()")}</div></div><div class="panel"><div class="panel-head"><h2>My Projects</h2><button class="mini-action" onclick="go('Projects')">All Projects ↗</button></div><table><thead><tr><th>Project</th><th>Status</th><th style="text-align:right">Budget</th></tr></thead><tbody>${db.projects.slice(-5).reverse().map(p=>`<tr><td>${esc(p.name)}</td><td><span class="tag">${esc(p.status)}</span></td><td style="text-align:right">${money(p.budget)}</td></tr>`).join('')||'<tr><td colspan="3">No projects yet. Add your first project.</td></tr>'}</tbody></table><div class="panel-foot">${button('+ New Project',"newProject()")}</div></div></div>`} 
function estimateTotal(e){return e.items.reduce((s,i)=>s+Number(i.qty||0)*(Number(i.material||0)+Number(i.labor||0)+Number(i.equipment||0)+Number(i.sub||0)),0)*(1+Number(e.markup||0)/100)}function newEstimate(){let name=prompt('Estimate name (e.g. Millmont Sitework)');if(!name)return;let e={id:uid(),name,markup:15,items:[{name:'Excavation',unit:'CY',qty:100,material:0,labor:7,equipment:12,sub:0}]};db.estimates.push(e);currentEstimate=e.id;save();go('Estimating')}function estimating(){let e=db.estimates.find(x=>x.id===currentEstimate)||db.estimates.at(-1);if(e)currentEstimate=e.id;return `<h1>Construction Estimating</h1><p>Build itemized bids with material, labor, equipment, subcontract, and markup.</p><div class="toolbar">${button('+ New Estimate','newEstimate()')}<select onchange="currentEstimate=this.value;render()">${db.estimates.map(x=>`<option value="${x.id}" ${x.id===currentEstimate?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${e?button('Export Estimate CSV','exportEstimate()','secondary')+button('Delete Estimate','deleteEstimate()','danger'):''}</div>${e?`<div class="panel"><div class="row">${field('Estimate name','estName',e.name)}${field('Markup %','markup',e.markup,'number')}${button('Save Changes','saveEstimateHeader()')}</div><div class="scroll"><table><thead><tr><th>Item</th><th>Unit</th><th>Qty</th><th>Material / unit</th><th>Labor / unit</th><th>Equipment / unit</th><th>Sub / unit</th><th>Total</th><th></th></tr></thead><tbody>${e.items.map((i,j)=>`<tr><td><input value="${esc(i.name)}" onchange="itemEdit(${j},'name',this.value)"></td><td><input value="${esc(i.unit)}" onchange="itemEdit(${j},'unit',this.value)"></td>${['qty','material','labor','equipment','sub'].map(k=>`<td><input type="number" step="any" value="${i[k]}" onchange="itemEdit(${j},'${k}',this.value)"></td>`).join('')}<td>${money(i.qty*(+i.material + +i.labor + +i.equipment + +i.sub))}</td><td><button class="btn danger" onclick="removeItem(${j})">×</button></td></tr>`).join('')}</tbody></table></div><div class="toolbar">${button('+ Add Line Item','addItem()')}</div><div class="total">Bid Total: ${money(estimateTotal(e))}</div></div>`:'<div class="panel">Create your first estimate to begin.</div>'}`}
function saveEstimateHeader(){let e=db.estimates.find(x=>x.id===currentEstimate);e.name=$('estName').value;e.markup=+$('markup').value;save();render()}function itemEdit(j,k,v){let e=db.estimates.find(x=>x.id===currentEstimate);e.items[j][k]=['name','unit'].includes(k)?v:Number(v);save();render()}function addItem(){let e=db.estimates.find(x=>x.id===currentEstimate);e.items.push({name:'New item',unit:'EA',qty:1,material:0,labor:0,equipment:0,sub:0});save();render()}function removeItem(j){db.estimates.find(x=>x.id===currentEstimate).items.splice(j,1);save();render()}function deleteEstimate(){if(!confirm('Delete this estimate?'))return;db.estimates=db.estimates.filter(e=>e.id!==currentEstimate);currentEstimate=null;save();render()}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function download(name,text,type='text/plain'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function exportEstimate(){let e=db.estimates.find(x=>x.id===currentEstimate);let rows=[['Item','Unit','Quantity','Material per unit','Labor per unit','Equipment per unit','Sub per unit'],...e.items.map(i=>[i.name,i.unit,i.qty,i.material,i.labor,i.equipment,i.sub]),['Markup %',e.markup],['Bid Total',estimateTotal(e)]];download('estimate-'+e.id+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')}
function newProject(){let name=prompt('Project name');if(!name)return;db.projects.push({id:uid(),name,status:'Planning',budget:0,notes:''});save();go('Projects')}function projects(){return `<h1>Project Management</h1><p>Track project status, budgets, and notes.</p><div class="toolbar">${button('+ New Project','newProject()')}</div><div class="panel scroll"><table><thead><tr><th>Project</th><th>Status</th><th>Budget</th><th>Notes</th><th></th></tr></thead><tbody>${db.projects.map((p,j)=>`<tr><td><input value="${esc(p.name)}" onchange="projectEdit(${j},'name',this.value)"></td><td><select onchange="projectEdit(${j},'status',this.value)">${['Planning','Bidding','In Progress','On Hold','Complete'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="number" value="${p.budget}" onchange="projectEdit(${j},'budget',this.value)"></td><td><input value="${esc(p.notes)}" onchange="projectEdit(${j},'notes',this.value)"></td><td><button class="btn danger" onclick="deleteProject(${j})">×</button></td></tr>`).join('')}</tbody></table></div>`}function projectEdit(j,k,v){db.projects[j][k]=k==='budget'?+v:v;save()}function deleteProject(j){if(confirm('Delete project?')){db.projects.splice(j,1);save();render()}}
function newEarth(){let name=prompt('Earthwork worksheet name');if(!name)return;let e={id:uid(),name,area:10000,existing:102,proposed:100,swell:20,shrink:10};db.earthworks.push(e);currentEarth=e.id;save();go('Earthworks')}function earthCalc(e){let delta=e.existing-e.proposed,cy=Math.abs(delta)*e.area/27;return {cut:delta>0?cy:0,fill:delta<0?cy:0,loose:delta>0?cy*(1+e.swell/100):0,bankFill:delta<0?cy/(1-e.shrink/100):0}}function earthworks(){let e=db.earthworks.find(x=>x.id===currentEarth)||db.earthworks.at(-1);if(e)currentEarth=e.id;let c=e&&earthCalc(e);return `<h1>Earthworks</h1><p>Preliminary cut/fill volume from average existing and proposed elevations. This is not a surveyed terrain model.</p><div class="toolbar">${button('+ New Worksheet','newEarth()')}<select onchange="currentEarth=this.value;render()">${db.earthworks.map(x=>`<option value="${x.id}" ${x.id===currentEarth?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${e?`<div class="cols"><div class="panel"><h2>${esc(e.name)}</h2>${[['area','Site area (SF)'],['existing','Average existing elevation (ft)'],['proposed','Average proposed elevation (ft)'],['swell','Cut swell (%)'],['shrink','Fill shrink (%)']].map(([k,l])=>field(l,'earth_'+k,e[k],'number')).join('')}${button('Recalculate and Save','saveEarth()')}</div><div class="panel"><h2>Volume Results</h2><div class="earth">AVERAGE DEPTH MODEL</div><div class="summary"><span>Bank Cut</span><strong>${c.cut.toFixed(1)} CY</strong></div><div class="summary"><span>Compacted Fill</span><strong>${c.fill.toFixed(1)} CY</strong></div><div class="summary"><span>Loose Cut with Swell</span><strong>${c.loose.toFixed(1)} CY</strong></div><div class="summary"><span>Bank Material for Fill (shrink allowance)</span><strong>${c.bankFill.toFixed(1)} CY</strong></div><div class="note">Use survey points or a proper digital terrain model for detailed grading, haul balancing, and bid-critical quantities.</div></div></div>`:'<div class="panel">Create an earthwork worksheet to start.</div>'}`}
function saveEarth(){let e=db.earthworks.find(x=>x.id===currentEarth);for(let k of ['area','existing','proposed','swell','shrink'])e[k]=Number($('earth_'+k).value);if(e.area<0||e.shrink>=100){alert('Enter a positive area and shrink less than 100%.');return}save();render()}
function newTakeoff(){let name=prompt('Takeoff name');if(!name)return;let t={id:uid(),name,measurements:[],image:null};db.takeoffs.push(t);currentTakeoff=t.id;drawingImage=null;drawn=[];save();go('PDF Takeoff')}function takeoff(){let t=db.takeoffs.find(x=>x.id===currentTakeoff)||db.takeoffs.at(-1);if(t)currentTakeoff=t.id;return `<h1>PDF / Plan Takeoff</h1><p>Upload a plan image, calibrate scale, then tap endpoints for lengths or corners for areas.</p><div class="toolbar">${button('+ New Takeoff','newTakeoff()')}<select onchange="currentTakeoff=this.value;drawingImage=null;points=[];render()">${db.takeoffs.map(x=>`<option value="${x.id}" ${x.id===currentTakeoff?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${t?`<div class="panel"><div class="note">Upload a PDF or image. PDF pages render in your browser (internet needed for PDF renderer). Select a page, calibrate against a known dimension, then measure. Verify all quantities before bidding.</div><div class="toolbar"><input type="file" accept="image/*,application/pdf,.pdf" onchange="uploadPlan(this)"><select id="mode" onchange="drawMode=this.value;points=[];redraw()"><option value="length">Length (2 taps)</option><option value="area">Area (4 corner taps)</option><option value="calibrate">Calibrate (2 taps)</option><option value="count">Count (1 tap)</option></select><span id="pdfPages"></span><span>Scale: <b id="scaleText">${Number(t.scale||1).toFixed(4)} ft/pixel</b></span>${button('Clear Current Points','clearPoints()','secondary')}</div><div id="drawing" class="drawing">${t.image?`<img id="planImg" src="${t.image}" onload="initCanvas()"><canvas id="planCanvas"></canvas>`:'<div class="placeholder">Upload a JPG or PNG plan image to start measuring</div>'}</div><div class="toolbar">${button('Export Quantities CSV','exportTakeoff()','secondary')}${button('Clear Measurements','clearMeasurements()','danger')}</div><h2>Measured Quantities</h2><div class="scroll"><table><thead><tr><th>Type</th><th>Quantity</th><th>Unit</th><th></th></tr></thead><tbody>${t.measurements.map((m,j)=>`<tr><td>${esc(m.type)}</td><td>${m.value.toFixed(2)}</td><td>${m.unit}</td><td><button class="btn danger" onclick="removeMeasurement(${j})">×</button></td></tr>`).join('')}</tbody></table></div></div>`:'<div class="panel">Create a takeoff to begin.</div>'}`}
function uploadPlan(inp){let f=inp.files[0];if(!f)return;if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){openPdfPlan(f);return;}if(f.size>3*1024*1024){alert('Please use an image under 3 MB for browser storage.');return}let r=new FileReader();r.onload=()=>{let t=db.takeoffs.find(x=>x.id===currentTakeoff);t.image=r.result;t.measurements=[];t.scale=1;save();render()};r.readAsDataURL(f)}function initCanvas(){let img=$('planImg'),canvas=$('planCanvas');if(!img||!canvas||!img.complete||!img.naturalWidth)return;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.addEventListener('pointerdown',canvasTap);redraw()}function canvasTap(ev){let canvas=$('planCanvas'),r=canvas.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*canvas.width,y=(ev.clientY-r.top)/r.height*canvas.height;points.push({x,y});let needed=drawMode==='area'?4:drawMode==='count'?1:2;if(points.length===needed){let t=db.takeoffs.find(x=>x.id===currentTakeoff),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);if(drawMode==='count'){t.measurements.push({type:'Count',value:1,unit:'EA'});save()}else if(drawMode==='calibrate'){let feet=Number(prompt('Real-world distance between those points (feet):','10'));if(feet>0){t.scale=feet/dist(points[0],points[1]);save()}}else if(drawMode==='length'){t.measurements.push({type:'Length',value:dist(points[0],points[1])*(t.scale||1),unit:'LF'})}else{let area=0;for(let i=0;i<4;i++){let a=points[i],b=points[(i+1)%4];area+=a.x*b.y-b.x*a.y}t.measurements.push({type:'Area',value:Math.abs(area)/2*(t.scale||1)**2,unit:'SF'})}points=[];save();if(drawMode!=='calibrate'){render();return}}redraw()}function redraw(){let c=$('planCanvas');if(!c)return;let ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#ff7622';ctx.strokeStyle='#ff7622';ctx.lineWidth=Math.max(2,c.width/400);points.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill()});if(points.length>1){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}let t=db.takeoffs.find(x=>x.id===currentTakeoff);if($('scaleText')&&t)$('scaleText').textContent=Number(t.scale||1).toFixed(4)+' ft/pixel'}function clearPoints(){points=[];redraw()}function clearMeasurements(){if(confirm('Clear all measured quantities?')){db.takeoffs.find(x=>x.id===currentTakeoff).measurements=[];save();render()}}function removeMeasurement(j){db.takeoffs.find(x=>x.id===currentTakeoff).measurements.splice(j,1);save();render()}function exportTakeoff(){let t=db.takeoffs.find(x=>x.id===currentTakeoff);download('takeoff-'+t.id+'.csv',[['Type','Quantity','Unit'],...t.measurements.map(m=>[m.type,m.value,m.unit])].map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')}

function reports(){return `<h1>Reports</h1><p>Summary of estimates, project budgets, and earthwork worksheets.</p><div class="grid"><div class="stat"><span>Total Estimated Bids</span><strong>${money(db.estimates.reduce((s,e)=>s+estimateTotal(e),0))}</strong></div><div class="stat"><span>Project Budgets</span><strong>${money(db.projects.reduce((s,p)=>s+Number(p.budget||0),0))}</strong></div><div class="stat"><span>Open Tasks</span><strong>${db.tasks.filter(t=>t.status!=='Done').length}</strong></div><div class="stat"><span>Takeoff Measurements</span><strong>${db.takeoffs.reduce((s,t)=>s+t.measurements.length,0)}</strong></div></div><div class="toolbar">${button('Download Workspace JSON','backup()')}</div>`}function settings(){return `<h1>Settings & Data</h1><div class="panel"><h2>Workspace Storage</h2><p>Your information is stored in this browser on this device, not on a server. Clearing site data may delete it. Export backups regularly. Data does not automatically sync across devices.</p><div class="toolbar">${button('Export Backup JSON','backup()')}<label class="btn secondary">Import Backup JSON<input type="file" accept="application/json" onchange="restore(this)" style="display:none"></label>${button('Delete All Workspace Data','resetData()','danger')}</div><div class="note">For team accounts, cloud synchronization, multi-user permissions, and secure file storage, a hosted backend must be added.</div></div>`}function backup(){download('workhorse-pro-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.projects)||!Array.isArray(v.estimates)||!Array.isArray(v.takeoffs)||!Array.isArray(v.earthworks)||!Array.isArray(v.tasks))throw Error('Invalid backup');for(const k in defaultData)v[k]??=[];if(confirm('Replace existing workspace with this backup?')){db=v;save();render()}}catch(e){alert('Invalid backup: '+e.message)}};r.readAsText(f)}function resetData(){if(confirm('Permanently delete all local Workhorse Pro data?')){db=structuredClone(defaultData);save();render()}}

let pdfDocument=null,pdfSourceName='',pdfActiveTakeoff=null;
async function openPdfPlan(file){
 if(file.size>35*1024*1024)return alert('PDF exceeds 35 MB. Split the file into smaller plans.');
 const target=currentTakeoff;
 try{
  let lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
  let bytes=await file.arrayBuffer();
  pdfDocument=await lib.getDocument({data:new Uint8Array(bytes)}).promise;
  pdfSourceName=file.name;pdfActiveTakeoff=target;
  await renderPdfPage(1);
 }catch(err){console.error(err);alert('Unable to open PDF. Check your connection, or convert the page to a JPG/PNG.');}
}
async function renderPdfPage(pageNumber){
 if(!pdfDocument||pdfActiveTakeoff!==currentTakeoff)return;
 let page=await pdfDocument.getPage(pageNumber),vp=page.getViewport({scale:1});
 let factor=Math.min(1.8,1800/Math.max(vp.width,vp.height)),view=page.getViewport({scale:factor});
 let c=document.createElement('canvas');c.width=Math.ceil(view.width);c.height=Math.ceil(view.height);
 await page.render({canvasContext:c.getContext('2d'),viewport:view}).promise;
 let t=db.takeoffs.find(x=>x.id===currentTakeoff);if(!t)return;
 let oldPage=t.pdfPage||0;
 t.pageRecords??={};if(oldPage)t.pageRecords[oldPage]={measurements:t.measurements,scale:t.scale};
 t.image=c.toDataURL('image/jpeg',.78);t.pdfPage=pageNumber;t.pdfPages=pdfDocument.numPages;t.pdfName=pdfSourceName;
 if(oldPage!==pageNumber){let record=t.pageRecords[pageNumber];t.measurements=record?.measurements||[];t.scale=record?.scale||1;}
 save();render();
}
const previousInitCanvas=initCanvas;
initCanvas=function(){previousInitCanvas();let t=db.takeoffs.find(x=>x.id===currentTakeoff),holder=$('pdfPages');if(!holder||!t)return;
 if(pdfDocument&&pdfActiveTakeoff===currentTakeoff){holder.innerHTML=`<label>PDF page <select onchange="renderPdfPage(Number(this.value))">${Array.from({length:pdfDocument.numPages},(_,i)=>`<option value="${i+1}" ${t.pdfPage===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label>`;}
 else if(t.pdfName){holder.textContent=`Saved preview: ${t.pdfName} page ${t.pdfPage}. Re-upload the PDF to switch pages.`;}
};

function addRfi(){if(!val('rfiSubject').trim()||!val('rfiProject'))return alert('Choose a project and subject.');db.rfis.push({id:uid(),project:val('rfiProject'),subject:val('rfiSubject'),question:val('rfiQuestion'),assigned:val('rfiAssigned'),due:val('rfiDue'),response:'',status:'Open'});save();render()}
function equipmentPage(){let cost=db.equipment.reduce((a,x)=>a+Number(x.rate||0)*Number(x.hours||0),0);return `<h1>Equipment Fleet</h1><p>Track machines, hourly ownership or rental rates, and usage. Estimated charges: <b>${money(cost)}</b>.</p><div class="panel"><h2>Add Equipment</h2><div class="form-grid">${field('Machine / Asset','eqName')}${field('Asset ID','eqCode')}${field('Hourly Rate ($)','eqRate','0','number')}${field('Hours Used','eqHours','0','number')}</div>${button('Save Equipment','addEquipment()')}</div><div class="panel scroll"><table><thead><tr><th>Equipment</th><th>Asset ID</th><th>Rate / HR</th><th>Hours</th><th>Extended Cost</th><th></th></tr></thead><tbody>${db.equipment.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.code)}</td><td><input type="number" value="${Number(e.rate)}" onchange="updateNumeric('equipment','${e.id}','rate',this.value)"></td><td><input type="number" value="${Number(e.hours)}" onchange="updateNumeric('equipment','${e.id}','hours',this.value)"></td><td>${money(e.rate*e.hours)}</td><td>${button('Delete',`removeRecord('equipment','${e.id}')`,'danger')}</td></tr>`).join('')||'<tr><td colspan="6">No equipment.</td></tr>'}</tbody></table></div>`}

function timecardsPage(){let total=db.timecards.reduce((a,x)=>a+Number(x.hours||0)*Number(x.rate||0),0);return `<h1>Timecards</h1><p>Record labor hours and job costs. Estimated labor cost: <b>${money(total)}</b>.</p><div class="panel"><h2>New Timecard</h2><div class="form-grid"><div class="field"><label>Project</label>${optionProject('tcProject')}</div>${field('Employee / Crew','tcWorker')}${field('Work Date','tcDate',new Date().toISOString().slice(0,10),'date')}${field('Hours','tcHours','8','number')}${field('Cost Rate / Hour ($)','tcRate','0','number')}${field('Work Description','tcNotes')}</div>${button('Save Timecard','addTimecard()')}${button('Export Timecards CSV','exportTimecards()','secondary')}</div><div class="panel scroll"><table><thead><tr><th>Date</th><th>Project</th><th>Worker</th><th>Hours</th><th>Rate</th><th>Cost</th><th>Notes</th><th></th></tr></thead><tbody>${db.timecards.map(t=>`<tr><td>${esc(t.date)}</td><td>${projectName(t.project)}</td><td>${esc(t.worker)}</td><td>${t.hours}</td><td>${money(t.rate)}</td><td>${money(t.hours*t.rate)}</td><td>${esc(t.notes)}</td><td>${button('Delete',`removeRecord('timecards','${t.id}')`,'danger')}</td></tr>`).join('')||'<tr><td colspan="8">No timecards.</td></tr>'}</tbody></table></div>`}
function addTimecard(){let hours=Number(val('tcHours')),rate=Number(val('tcRate'));if(!val('tcProject')||!val('tcWorker').trim()||!Number.isFinite(hours)||hours<0||!Number.isFinite(rate)||rate<0)return alert('Enter project, worker, and valid hours/rate.');db.timecards.push({id:uid(),project:val('tcProject'),worker:val('tcWorker'),date:val('tcDate'),hours,rate,notes:val('tcNotes')});save();render()}

function gridEarthPage(){let g=db.grids.at(-1);let result=g?gridVolumes(g):null;return `<h1>Grid Earthworks</h1><p>Enter existing and proposed spot elevations at a rectangular grid. Each cell is calculated using the average of its four corner elevation differences, with mixed cut/fill approximated by triangular subdivision.</p><div class="note">Preliminary grid method only. Not a substitute for a certified survey, digital terrain model, or engineer-approved earthwork takeoff.</div><div class="toolbar">${button('Create 3 × 3 Grid','newGrid()')}</div>${g?`<div class="panel"><h2>${esc(g.name)}</h2><div class="form-grid">${field('Cell width (ft)','gridDx',g.dx,'number')}${field('Cell height (ft)','gridDy',g.dy,'number')}</div><h3>Existing elevations (ft)</h3><div class="grid-table">${g.existing.map((row,i)=>`<div class="toolbar">${row.map((v,j)=>`<input aria-label="Existing ${i+1}-${j+1}" type="number" step="any" style="width:90px" value="${v}" onchange="setGridPoint('existing',${i},${j},this.value)">`).join('')}</div>`).join('')}</div><h3>Proposed elevations (ft)</h3><div class="grid-table">${g.proposed.map((row,i)=>`<div class="toolbar">${row.map((v,j)=>`<input aria-label="Proposed ${i+1}-${j+1}" type="number" step="any" style="width:90px" value="${v}" onchange="setGridPoint('proposed',${i},${j},this.value)">`).join('')}</div>`).join('')}</div>${button('Save Grid Spacing','saveGridSpacing()')} ${button('Export Grid CSV','exportGrid()','secondary')}</div><div class="grid"><div class="stat"><span>Cut Volume</span><strong>${result.cut.toFixed(2)} CY</strong></div><div class="stat"><span>Fill Volume</span><strong>${result.fill.toFixed(2)} CY</strong></div><div class="stat"><span>Net (Cut − Fill)</span><strong>${(result.cut-result.fill).toFixed(2)} CY</strong></div></div>`:'<div class="panel">Create a grid to begin.</div>'}`}
function newGrid(){let name=prompt('Grid worksheet name','New Grading Grid');if(!name)return;db.grids.push({id:uid(),name,dx:25,dy:25,existing:[[100,100,100],[100,100,100],[100,100,100]],proposed:[[99,99,99],[99,99,99],[99,99,99]]});save();render()}
function setGridPoint(kind,i,j,v){let n=Number(v);if(!Number.isFinite(n))return alert('Invalid elevation');db.grids.at(-1)[kind][i][j]=n;save();render()}
function saveGridSpacing(){let dx=Number(val('gridDx')),dy=Number(val('gridDy'));if(!Number.isFinite(dx)||!Number.isFinite(dy)||dx<=0||dy<=0)return alert('Cell dimensions must be positive.');Object.assign(db.grids.at(-1),{dx,dy});save();render()}
// A square is split into four triangles at its interpolated center; each triangle is
// clipped at the zero-difference contour, and the signed linear volume is integrated.
function triangleVolume(pts){let pos=pts.filter(p=>p.d>0),neg=pts.filter(p=>p.d<0);if(!pos.length||!neg.length){let area=Math.abs((pts[1].x-pts[0].x)*(pts[2].y-pts[0].y)-(pts[2].x-pts[0].x)*(pts[1].y-pts[0].y))/2;let v=area*pts.reduce((a,p)=>a+p.d,0)/3;return {cut:Math.max(0,v),fill:Math.max(0,-v)}}let clip=(keepPositive)=>{let poly=[];for(let i=0;i<3;i++){let a=pts[i],b=pts[(i+1)%3],ina=keepPositive?a.d>=0:a.d<=0,inb=keepPositive?b.d>=0:b.d<=0;if(ina)poly.push(a);if(ina!==inb){let t=a.d/(a.d-b.d);poly.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,d:0})}}let vol=0;for(let i=1;i<poly.length-1;i++){let a=poly[0],b=poly[i],c=poly[i+1];vol+=Math.abs((b.x-a.x)*(c.y-a.y)-(c.x-a.x)*(b.y-a.y))/2*(a.d+b.d+c.d)/3}return Math.abs(vol)};return {cut:clip(true),fill:clip(false)}}
function gridVolumes(g){let cut=0,fill=0;for(let i=0;i<g.existing.length-1;i++)for(let j=0;j<g.existing[0].length-1;j++){let ds=[[i,j],[i,j+1],[i+1,j+1],[i+1,j]].map(([r,c])=>g.existing[r][c]-g.proposed[r][c]);let pts=[{x:0,y:0,d:ds[0]},{x:g.dx,y:0,d:ds[1]},{x:g.dx,y:g.dy,d:ds[2]},{x:0,y:g.dy,d:ds[3]}],center={x:g.dx/2,y:g.dy/2,d:ds.reduce((a,b)=>a+b,0)/4};for(let k=0;k<4;k++){let v=triangleVolume([pts[k],pts[(k+1)%4],center]);cut+=v.cut;fill+=v.fill}}return {cut:cut/27,fill:fill/27}}
function exportGrid(){let g=db.grids.at(-1);if(!g)return;let rows=[['Row','Column','Existing','Proposed','Difference (cut positive)']];for(let i=0;i<3;i++)for(let j=0;j<3;j++)rows.push([i+1,j+1,g.existing[i][j],g.proposed[i][j],g.existing[i][j]-g.proposed[i][j]]);download('workhorse-grid.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')}
